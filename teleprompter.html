<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Téléprompteur Pro - Baniki Labs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --gold: #ffd700;
        }
        
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Styles spécifiques au prompteur */
        .mirrored-text {
            transform: scaleX(-1);
        }

        .glass-panel {
            background: rgba(18, 18, 18, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 215, 0, 0.1);
            transition: background 0.3s, border-color 0.3s;
        }

        /* Curseur personnalisé pour les inputs range (sliders) */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--gold);
            cursor: pointer;
            margin-top: -6px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            transition: background 0.3s;
        }
        
        #prompter-display:focus {
            outline: none;
        }

        /* Video / Camera styles */
        #camera-preview {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1; /* Derrière le texte */
            opacity: 0.8; /* Légèrement transparent pour que le texte soit lisible */
            display: none;
        }
        
        #prompter-text-wrapper {
            position: relative;
            z-index: 2; /* Au-dessus de la caméra */
        }

        .camera-active #prompter-display {
           background-color: transparent;
        }
        
        .recording-indicator {
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* --- STREAMING_CHUNK:Définition des différents thèmes visuels --- */
        
        /* 1. Mode Clair Classique */
        body.theme-light {
            background-color: #f3f4f6 !important;
            color: #111827 !important;
        }
        body.theme-light .glass-panel {
            background: rgba(255, 255, 255, 0.85) !important;
            border-color: rgba(0, 0, 0, 0.1) !important;
        }
        body.theme-light .text-white { color: #111827 !important; }
        body.theme-light .text-gray-400 { color: #4b5563 !important; }
        body.theme-light .text-gray-300 { color: #374151 !important; }
        body.theme-light .bg-black { background-color: #ffffff !important; }
        body.theme-light .bg-white\/5 { background-color: rgba(0, 0, 0, 0.04) !important; }
        body.theme-light .bg-white\/10 { background-color: rgba(0, 0, 0, 0.08) !important; }
        body.theme-light .bg-white\/20 { background-color: rgba(0, 0, 0, 0.15) !important; }
        body.theme-light .hover\:bg-white\/10:hover { background-color: rgba(0, 0, 0, 0.08) !important; }
        body.theme-light .hover\:bg-white\/20:hover { background-color: rgba(0, 0, 0, 0.15) !important; }
        body.theme-light .hover\:bg-white\/30:hover { background-color: rgba(0, 0, 0, 0.22) !important; }
        body.theme-light .border-white\/10,
        body.theme-light .border-white\/20 { border-color: rgba(0, 0, 0, 0.15) !important; }
        body.theme-light #prompter-mode { background-color: #f3f4f6 !important; }
        body.theme-light #prompter-text,
        body.theme-light #mini-prompter-text { color: #000000 !important; }
        body.theme-light input[type=range]::-webkit-slider-runnable-track { background: rgba(0, 0, 0, 0.15); }
        body.theme-light .placeholder\:text-gray-600::placeholder { color: #9ca3af !important; }
        body.theme-light #fs-camera-overlay { background-color: rgba(255, 255, 255, 0.55) !important; }

        /* 2. Mode Gris / Confort Visuel (Eye Comfort / Sepia-Gris Doux) */
        body.theme-comfort {
            background-color: #1e2229 !important;
            color: #d1d5db !important;
        }
        body.theme-comfort .glass-panel {
            background: rgba(30, 34, 41, 0.85) !important;
            border-color: rgba(156, 163, 175, 0.2) !important;
        }
        body.theme-comfort .text-white { color: #e5e7eb !important; }
        body.theme-comfort .text-gray-400 { color: #9ca3af !important; }
        body.theme-comfort .text-gray-300 { color: #d1d5db !important; }
        body.theme-comfort .bg-black { background-color: #14171d !important; }
        body.theme-comfort .bg-white\/5 { background-color: rgba(255, 255, 255, 0.05) !important; }
        body.theme-comfort .bg-white\/10 { background-color: rgba(255, 255, 255, 0.08) !important; }
        body.theme-comfort .bg-white\/20 { background-color: rgba(255, 255, 255, 0.15) !important; }
        body.theme-comfort .hover\:bg-white\/10:hover { background-color: rgba(255, 255, 255, 0.1) !important; }
        body.theme-comfort .hover\:bg-white\/20:hover { background-color: rgba(255, 255, 255, 0.2) !important; }
        body.theme-comfort .border-white\/10,
        body.theme-comfort .border-white\/20 { border-color: rgba(255, 255, 255, 0.15) !important; }
        body.theme-comfort #prompter-mode { background-color: #14171d !important; }
        body.theme-comfort #prompter-text,
        body.theme-comfort #mini-prompter-text { color: #f3f4f6 !important; }
        body.theme-comfort input[type=range]::-webkit-slider-runnable-track { background: rgba(255, 255, 255, 0.2); }
        body.theme-comfort #fs-camera-overlay { background-color: rgba(20, 23, 29, 0.6) !important; }

        /* 3. Mode Ambre Rétro (Studio Pro Contraste Élevé) */
        body.theme-amber {
            background-color: #0d0a00 !important;
            color: #ffb000 !important;
        }
        body.theme-amber .glass-panel {
            background: rgba(20, 15, 0, 0.85) !important;
            border-color: rgba(255, 176, 0, 0.3) !important;
        }
        body.theme-amber .text-white { color: #ffca28 !important; }
        body.theme-amber .text-gray-400 { color: #bcaaa4 !important; }
        body.theme-amber .text-gray-300 { color: #ffe082 !important; }
        body.theme-amber .bg-black { background-color: #050300 !important; }
        body.theme-amber .bg-white\/5 { background-color: rgba(255, 176, 0, 0.05) !important; }
        body.theme-amber .bg-white\/10 { background-color: rgba(255, 176, 0, 0.1) !important; }
        body.theme-amber .bg-white\/20 { background-color: rgba(255, 176, 0, 0.2) !important; }
        body.theme-amber .hover\:bg-white\/10:hover { background-color: rgba(255, 176, 0, 0.15) !important; }
        body.theme-amber .hover\:bg-white\/20:hover { background-color: rgba(255, 176, 0, 0.25) !important; }
        body.theme-amber .border-white\/10,
        body.theme-amber .border-white\/20 { border-color: rgba(255, 176, 0, 0.25) !important; }
        body.theme-amber #prompter-mode { background-color: #050300 !important; }
        body.theme-amber #prompter-text,
        body.theme-amber #mini-prompter-text { color: #ffb000 !important; }
        body.theme-amber input[type=range]::-webkit-slider-runnable-track { background: rgba(255, 176, 0, 0.3); }
        body.theme-amber #fs-camera-overlay { background-color: rgba(5, 3, 0, 0.7) !important; }

        /* Notification Toast personnalisée */
        #toast-notification {
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        #toast-notification.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col relative p-4 sm:p-8 transition-colors duration-300">

    <!-- Notification Toast -->
    <div id="toast-notification" class="fixed bottom-6 right-6 z-[200] bg-[var(--gold)] text-black px-5 py-3 rounded-xl shadow-2xl font-bold flex items-center gap-3">
        <i class="fa-solid fa-circle-check text-lg" id="toast-icon"></i>
        <span id="toast-message">Action réussie !</span>
    </div>

    <main id="setup-screen" class="w-full max-w-7xl mx-auto flex flex-col flex-grow">
        
        <!-- En-tête avec logo, gestionnaire de thèmes et langue -->
        <div class="flex flex-col sm:flex-row justify-between items-center mb-8 gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-[var(--gold)] flex items-center justify-center text-black font-black text-xl shadow-[0_0_15px_rgba(255,215,0,0.4)]">B</div>
                <span class="font-bold text-xl tracking-widest uppercase text-white transition-colors duration-300">Baniki Labs</span>
            </div>
            
            <div class="flex items-center gap-3 flex-wrap justify-center">
                <!-- Sélecteur de Thèmes Avancé -->
                <div class="flex items-center bg-white/10 border border-white/20 rounded-xl p-1 transition-colors duration-300">
                    <button onclick="setTheme('dark')" id="theme-btn-dark" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-[var(--gold)] text-black" title="Mode Sombre Studio">
                        <i class="fa-solid fa-moon"></i> <span class="hidden md:inline">Sombre</span>
                    </button>
                    <button onclick="setTheme('comfort')" id="theme-btn-comfort" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-white hover:bg-white/10" title="Mode Gris Confort Oculaire">
                        <i class="fa-solid fa-eye"></i> <span class="hidden md:inline">Gris Confort</span>
                    </button>
                    <button onclick="setTheme('light')" id="theme-btn-light" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-white hover:bg-white/10" title="Mode Clair">
                        <i class="fa-solid fa-sun"></i> <span class="hidden md:inline">Clair</span>
                    </button>
                    <button onclick="setTheme('amber')" id="theme-btn-amber" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-white hover:bg-white/10" title="Mode Ambre Rétro">
                        <i class="fa-solid fa-bolt"></i> <span class="hidden md:inline">Ambre</span>
                    </button>
                </div>

                <select id="lang-select" class="bg-white/10 border border-white/20 text-white text-sm rounded-lg focus:ring-[var(--gold)] focus:border-[var(--gold)] block p-2.5 outline-none cursor-pointer transition-colors duration-300">
                    <option value="fr" class="text-black">Français</option>
                    <option value="en" class="text-black">English</option>
                    <option value="sw" class="text-black">Kiswahili</option>
                </select>
            </div>
        </div>

        <div class="text-center mb-4">
            <h1 class="text-3xl sm:text-5xl font-black tracking-tighter uppercase text-white mb-2 transition-colors duration-300" data-translate="page-title">Téléprompteur Pro</h1>
            <p class="text-gray-400 text-sm transition-colors duration-300" data-translate="page-desc">Sélectionnez ou créez votre script de conversion, configurez vos paramètres et démarrez.</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 flex-grow">
            <!-- Zone principale (Prévisualisation + Saisie) -->
            <div class="lg:col-span-2 flex flex-col gap-6">
                
                <!-- Gestionnaire de scripts (Présélections conversion & personnalisés) -->
                <div class="glass-panel p-4 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-4">
                    <div class="flex items-center gap-2 w-full sm:w-auto">
                        <i class="fa-solid fa-bullhorn text-[var(--gold)]"></i>
                        <span class="text-xs font-bold uppercase tracking-wider text-gray-300" data-translate="script-preset">Modèles de vente :</span>
                    </div>
                    <div class="flex items-center gap-2 w-full sm:w-auto overflow-x-auto no-scrollbar pb-1 sm:pb-0">
                        <button onclick="loadScriptPreset('saas')" class="px-3 py-1.5 bg-white/10 hover:bg-white/20 rounded-xl text-xs font-bold text-white transition-all whitespace-nowrap" data-translate="preset-saas">🚀 Logiciel & SaaS</button>
                        <button onclick="loadScriptPreset('agency')" class="px-3 py-1.5 bg-white/10 hover:bg-white/20 rounded-xl text-xs font-bold text-white transition-all whitespace-nowrap" data-translate="preset-agency">💼 Agence & Services</button>
                        <button onclick="loadScriptPreset('ecommerce')" class="px-3 py-1.5 bg-white/10 hover:bg-white/20 rounded-xl text-xs font-bold text-white transition-all whitespace-nowrap" data-translate="preset-ecommerce">🛍️ E-commerce & Promo</button>
                        <button onclick="openNewScriptModal()" class="px-3 py-1.5 bg-[var(--gold)] text-black rounded-xl text-xs font-black transition-all hover:scale-105 whitespace-nowrap" title="Créer un nouveau script"><i class="fa-solid fa-plus"></i> <span data-translate="new-script">Nouveau</span></button>
                    </div>
                </div>

                <!-- Aperçu Mini du Prompteur -->
                <div class="flex flex-col gap-2">
                    <label class="text-[var(--gold)] font-bold uppercase tracking-widest text-xs flex items-center justify-between">
                        <span class="flex items-center gap-2"><i class="fa-solid fa-desktop"></i> <span data-translate="preview">Aperçu & Enregistrement</span></span>
                    </label>
                    
                    <div id="mini-prompter-container" class="relative w-full h-[260px] bg-black border border-white/10 rounded-2xl overflow-hidden group transition-colors duration-300">
                        
                        <!-- Element Video pour la Camera -->
                        <video id="camera-preview" autoplay muted playsinline></video>

                        <!-- Zone de défilement (Mini) -->
                        <div id="mini-prompter-display" class="absolute inset-0 overflow-hidden no-scrollbar w-full px-8 pointer-events-none z-10">
                             <div id="mini-prompter-padding-top" class="w-full"></div>
                             <div id="mini-prompter-text" class="w-full max-w-4xl mx-auto text-white font-bold leading-relaxed pb-[50vh] text-center text-3xl transition-colors duration-300">
                                <!-- Le texte sera mis à jour en temps réel -->
                             </div>
                        </div>

                        <!-- Masque d'ombre pour lisibilité -->
                        <div class="absolute inset-0 bg-gradient-to-b from-black/60 via-transparent to-black/60 pointer-events-none z-[5] transition-colors duration-300"></div>
                        
                        <!-- Contrôles flottants sur l'aperçu -->
                        <div class="absolute top-4 right-4 flex gap-2 z-20">
                            <!-- Toggle Camera -->
                            <button id="toggleCameraBtn" class="w-10 h-10 rounded-full bg-white/10 backdrop-blur text-white flex items-center justify-center hover:bg-white/20 transition-all" title="Activer/Désactiver la caméra">
                                <i class="fa-solid fa-video-slash"></i>
                            </button>
                            <!-- Start Recording -->
                            <button id="recordBtn" class="w-10 h-10 rounded-full bg-red-500/20 text-red-500 border border-red-500/50 flex items-center justify-center hover:bg-red-500 hover:text-white transition-all hidden" title="Enregistrer Vidéo/Audio">
                                <i class="fa-solid fa-circle"></i>
                            </button>
                            <!-- Plein Ecran -->
                            <button onclick="initPrompter(true)" class="w-10 h-10 rounded-full bg-white/10 backdrop-blur text-white flex items-center justify-center hover:bg-[var(--gold)] hover:text-black transition-all" title="Mode Plein Écran">
                                <i class="fa-solid fa-expand"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Zone de Saisie du Script avec boutons Copier / Coller -->
                <div class="flex flex-col gap-2 flex-grow">
                    <div class="flex items-center justify-between">
                        <label for="script-input" class="text-[var(--gold)] font-bold uppercase tracking-widest text-xs flex items-center gap-2">
                            <i class="fa-solid fa-align-left"></i> <span data-translate="your-script">Votre Script de Vente</span>
                        </label>
                        <!-- Boutons Copier / Coller rapides -->
                        <div class="flex items-center gap-2">
                            <button onclick="copyScriptToClipboard()" class="px-3 py-1 bg-white/10 hover:bg-white/20 text-white rounded-lg text-xs font-bold transition-all flex items-center gap-1.5" title="Copier le script">
                                <i class="fa-regular fa-copy"></i> <span data-translate="btn-copy">Copier</span>
                            </button>
                            <button onclick="pasteScriptFromClipboard()" class="px-3 py-1 bg-white/10 hover:bg-white/20 text-white rounded-lg text-xs font-bold transition-all flex items-center gap-1.5" title="Coller depuis le presse-papier">
                                <i class="fa-regular fa-paste"></i> <span data-translate="btn-paste">Coller</span>
                            </button>
                        </div>
                    </div>
                    <textarea id="script-input" class="w-full flex-grow min-h-[180px] lg:min-h-[220px] bg-white/5 border border-white/10 rounded-2xl p-6 text-white placeholder:text-gray-600 focus:outline-none focus:border-[var(--gold)] focus:ring-1 focus:ring-[var(--gold)]/50 transition-all duration-300 text-base sm:text-lg resize-y" placeholder="Collez ou rédigez votre script ici..."></textarea>
                </div>
            </div>

            <!-- Panneau Latéral de Configuration -->
            <div class="glass-panel rounded-2xl p-6 flex flex-col gap-6 h-fit sticky top-28">
                <div>
                    <label class="text-gray-300 text-xs font-bold uppercase tracking-wider block mb-3 flex justify-between transition-colors duration-300">
                        <span data-translate="font-size">Taille du texte</span>
                        <span id="font-val" class="text-[var(--gold)]">64px</span>
                    </label>
                    <input type="range" id="font-size-slider" min="20" max="150" value="64">
                </div>

                <div>
                    <label class="text-gray-300 text-xs font-bold uppercase tracking-wider block mb-3 flex justify-between transition-colors duration-300">
                        <span data-translate="speed">Vitesse de défilement</span>
                        <span id="speed-val" class="text-[var(--gold)]">x1.0</span>
                    </label>
                    <input type="range" id="speed-slider" min="0.1" max="5" step="0.1" value="1.0">
                </div>

                <div class="flex items-center justify-between pt-2 border-t border-white/10 transition-colors duration-300">
                    <label class="text-gray-300 text-xs font-bold uppercase tracking-wider transition-colors duration-300" data-translate="mirror-mode">Mode Miroir (Inversé)</label>
                    <button id="mirror-toggle" onclick="toggleMirrorSetting()" class="w-12 h-6 bg-white/20 rounded-full relative transition-all duration-300">
                        <div id="mirror-knob" class="w-4 h-4 bg-white rounded-full absolute left-1 top-1 transition-transform duration-300"></div>
                    </button>
                </div>

                <div class="pt-2 border-t border-white/10 transition-colors duration-300">
                    <label class="text-gray-300 text-xs font-bold uppercase tracking-wider block mb-3 transition-colors duration-300" data-translate="alignment">Alignement</label>
                    <div class="flex gap-2 bg-white/5 p-1 rounded-xl transition-colors duration-300">
                        <button onclick="setAlignment('left')" id="align-left" class="flex-1 py-2 rounded-lg text-white hover:bg-white/10 transition-colors"><i class="fa-solid fa-align-left"></i></button>
                        <button onclick="setAlignment('center')" id="align-center" class="flex-1 py-2 rounded-lg bg-[var(--gold)] text-black transition-colors"><i class="fa-solid fa-align-center"></i></button>
                        <button onclick="setAlignment('right')" id="align-right" class="flex-1 py-2 rounded-lg text-white hover:bg-white/10 transition-colors"><i class="fa-solid fa-align-right"></i></button>
                    </div>
                </div>

                <div class="pt-6 border-t border-white/10 transition-colors duration-300 mt-auto flex flex-col gap-3">
                    <button id="startPrompterBtn" onclick="initPrompter(true)" class="w-full bg-[var(--gold)] text-black font-black uppercase tracking-widest py-4 rounded-xl hover:scale-[1.02] transition-transform shadow-[0_0_20px_rgba(255,215,0,0.3)] flex justify-center items-center gap-2">
                        <i class="fa-solid fa-expand"></i> <span data-translate="start-prompter">Prompteur Plein Écran</span>
                    </button>
                    <!-- Mini play controls pour l'aperçu -->
                    <div class="flex justify-between items-center bg-white/5 p-2 rounded-xl transition-colors duration-300">
                         <span class="text-xs text-gray-400 font-bold uppercase ml-2 transition-colors duration-300" data-translate="preview">Aperçu:</span>
                         <div class="flex gap-2">
                             <button onclick="restartPreview()" class="w-10 h-10 rounded-full text-white/50 hover:text-white transition-colors" title="Recommencer">
                                 <i class="fa-solid fa-rotate-left"></i>
                             </button>
                             <button id="playPreviewBtn" onclick="togglePlayPreview()" class="w-10 h-10 rounded-full bg-white/20 text-white flex items-center justify-center hover:bg-white/30 transition-colors">
                                 <i class="fa-solid fa-play ml-0.5" id="playPreviewIcon"></i>
                             </button>
                         </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Plein Écran Téléprompteur -->
    <div id="prompter-mode" class="fixed inset-0 bg-black z-[100] hidden flex-col transition-colors duration-300">
        <video id="fs-camera-preview" autoplay muted playsinline style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:1;opacity:0.8;display:none;"></video>
        <div id="fs-camera-overlay" class="absolute inset-0 bg-black/40 z-[2] hidden pointer-events-none transition-colors duration-300"></div>

        <div id="prompter-display" class="flex-grow overflow-y-auto no-scrollbar w-full px-4 sm:px-12 md:px-24 scroll-smooth relative z-10" tabindex="0">
            <div id="prompter-padding-top" class="w-full"></div>
            <div id="prompter-text-wrapper" class="w-full max-w-6xl mx-auto pb-[80vh]">
                <div id="prompter-text" class="text-white font-bold leading-relaxed text-center transition-colors duration-300">
                </div>
            </div>
        </div>

        <div id="prompter-controls" class="absolute bottom-6 left-1/2 -translate-x-1/2 glass-panel rounded-full px-6 py-3 flex items-center gap-6 shadow-2xl transition-opacity duration-500 opacity-100 hover:opacity-100 z-20">
            <button onclick="adjustSpeed(-0.2)" class="text-white/70 hover:text-[var(--gold)] transition-colors" title="Ralentir">
                <i class="fa-solid fa-backward-step"></i>
            </button>
            <button id="playPauseBtn" onclick="togglePlayPause()" class="w-14 h-14 rounded-full bg-[var(--gold)] text-black flex items-center justify-center text-xl shadow-[0_0_15px_rgba(255,215,0,0.4)] hover:scale-110 transition-transform">
                <i class="fa-solid fa-play ml-1" id="playIcon"></i>
            </button>
            <button onclick="adjustSpeed(0.2)" class="text-white/70 hover:text-[var(--gold)] transition-colors" title="Accélérer">
                <i class="fa-solid fa-forward-step"></i>
            </button>
            <button onclick="restartPrompter()" class="text-white/50 hover:text-white transition-colors" title="Recommencer">
                <i class="fa-solid fa-rotate-left"></i>
            </button>
            <button onclick="exitPrompter()" class="text-white/50 hover:text-white transition-colors" title="Quitter">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="h-6 w-px bg-white/20 hidden fs-record-element transition-colors duration-300"></div>

    <script>
        // --- STREAMING_CHUNK:Traductions multilingues ---

        };

        const langSelect = document.getElementById('lang-select');
        langSelect.addEventListener('change', (e) => {
            const lang = e.target.value;
            document.querySelectorAll('[data-translate]').forEach(el => {
                const key = el.getAttribute('data-translate');
                if(translations[lang] && translations[lang][key]) {
                    el.innerText = translations[lang][key];
                }
            });
        });

        // --- STREAMING_CHUNK:Modèles de scripts incitant à la souscription ---
        const salesPresets = {
            saas: "Vous en avez assez de perdre des heures sur des tâches répétitives ?\n\nChez Baniki Labs, nous avons conçu la solution ultime pour automatiser votre croissance en un clic.\n\nRejoignez dès aujourd'hui les plus de 5 000 entrepreneurs qui font confiance à notre plateforme.\n\nCliquez sur le lien ci-dessous pour démarrer votre essai gratuit de 14 jours dès maintenant !",
            agency: "Vous souhaitez scaler votre chiffre d'affaires et attirer des clients haut de gamme chaque semaine ?\n\nNotre équipe d'experts chez Baniki Labs déploie pour vous des stratégies sur-mesure à fort ROI.\n\nNe laissez pas vos concurrents prendre une longueur d'avance.\n\nRéservez votre audit stratégique offert dès maintenant et passez au niveau supérieur !",
            ecommerce: "Attention ! Offre exclusive limitée aux 100 prochaines commandes seulement !\n\nProfitez de réductions exceptionnelles sur notre collection exclusive grâce aux solutions d'accélération Baniki Labs.\n\nStock limité, livraison express offerte.\n\nAjoutez au panier dès maintenant avant qu'il ne soit trop tard !"
        };

        const scriptInput = document.getElementById('script-input');
        scriptInput.value = salesPresets.saas;

        function loadScriptPreset(type) {
            if(salesPresets[type]) {
                scriptInput.value = salesPresets[type];
                updatePreviewContent();
                showToast("Modèle de script chargé avec succès !");
            }
        }

        // --- STREAMING_CHUNK:Gestion des thèmes multiples (Sombre, Gris Confort, Clair, Ambre) ---
        function setTheme(themeName) {
            document.body.classList.remove('theme-light', 'theme-comfort', 'theme-amber');
            
            // Réinitialiser les boutons de thème
            ['dark', 'comfort', 'light', 'amber'].forEach(t => {
                const btn = document.getElementById(`theme-btn-${t}`);
                if(btn) {
                    btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-white hover:bg-white/10";
                }
            });

            if(themeName !== 'dark') {
                document.body.classList.add(`theme-${themeName}`);
            }

            const activeBtn = document.getElementById(`theme-btn-${themeName}`);
            if(activeBtn) {
                activeBtn.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-[var(--gold)] text-black";
            }

            localStorage.setItem('baniki-teleprompter-theme', themeName);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('baniki-teleprompter-theme') || 'dark';
            setTheme(savedTheme);
            updatePreviewContent();
        });

        // --- STREAMING_CHUNK:Fonctions Copier / Coller avec Toast de notification ---
        function copyScriptToClipboard() {
            const textToCopy = scriptInput.value;
            if (!textToCopy.trim()) return;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    showToast("Script copié dans le presse-papier !");
                }).catch(() => {
                    fallbackCopy(textToCopy);
                });
            } else {
                fallbackCopy(textToCopy);
            }
        }

        function fallbackCopy(text) {
            scriptInput.select();
            try {
                document.execCommand('copy');
                showToast("Script copié !");
            } catch (err) {
                showToast("Erreur lors de la copie.");
            }
        }

        async function pasteScriptFromClipboard() {
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    const text = await navigator.clipboard.readText();
                    scriptInput.value = text;
                    updatePreviewContent();
                    showToast("Script collé avec succès !");
                } else {
                    showToast("Veuillez utiliser Ctrl+V pour coller.");
                }
            } catch (err) {
                showToast("Permission de presse-papier refusée.");
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast-notification');
            document.getElementById('toast-message').innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // --- STREAMING_CHUNK:Gestionnaire de Scripts Sauvegardés (LocalStorage) ---
        const scriptModal = document.getElementById('script-modal');
        const scriptTitleInput = document.getElementById('script-title-input');

        function openNewScriptModal() {
            scriptModal.classList.remove('hidden');
            scriptModal.classList.add('flex');
            renderSavedScriptsList();
        }

        function closeScriptModal() {
            scriptModal.classList.add('hidden');
            scriptModal.classList.remove('flex');
        }

        function saveCurrentScript() {
            const title = scriptTitleInput.value.trim() || `Script du ${new Date().toLocaleDateString()}`;
            const content = scriptInput.value;
            if(!content.trim()) return;

            let saved = JSON.parse(localStorage.getItem('baniki_saved_scripts') || '[]');
            saved.push({ title, content, date: new Date().toISOString() });
            localStorage.setItem('baniki_saved_scripts', JSON.stringify(saved));
            
            scriptTitleInput.value = '';
            showToast("Script sauvegardé dans vos favoris !");
            renderSavedScriptsList();
        }

        function renderSavedScriptsList() {
            const container = document.getElementById('saved-scripts-list');
            let saved = JSON.parse(localStorage.getItem('baniki_saved_scripts') || '[]');
            
            if(saved.length === 0) {
                container.innerHTML = '<p class="text-xs text-gray-500 italic text-center py-2">Aucun script personnel enregistré.</p>';
                return;
            }

            container.innerHTML = saved.map((item, index) => `
                <div class="flex items-center justify-between bg-white/5 p-2.5 rounded-xl hover:bg-white/10 transition-all">
                    <button onclick="loadSavedScript(${index})" class="text-left flex-grow truncate mr-2">
                        <span class="text-xs font-bold text-white block truncate">${item.title}</span>
                        <span class="text-[10px] text-gray-400 block truncate">${item.content.substring(0, 40)}...</span>
                    </button>
                    <button onclick="deleteSavedScript(${index})" class="text-red-400 hover:text-red-300 p-1.5" title="Supprimer"><i class="fa-solid fa-trash text-xs"></i></button>
                </div>
            `).join('');
        }

        function loadSavedScript(index) {
            let saved = JSON.parse(localStorage.getItem('baniki_saved_scripts') || '[]');
            if(saved[index]) {
                scriptInput.value = saved[index].content;
                updatePreviewContent();
                closeScriptModal();
                showToast(`Script "${saved[index].title}" chargé !`);
            }
        }

        function deleteSavedScript(index) {
            let saved = JSON.parse(localStorage.getItem('baniki_saved_scripts') || '[]');
            saved.splice(index, 1);
            localStorage.setItem('baniki_saved_scripts', JSON.stringify(saved));
            renderSavedScriptsList();
            showToast("Script supprimé.");
        }

        // --- STREAMING_CHUNK:Configuration des sliders et paramètres ---
        const fontSizeSlider = document.getElementById('font-size-slider');
        const speedSlider = document.getElementById('speed-slider');
        const fontVal = document.getElementById('font-val');
        const speedVal = document.getElementById('speed-val');
        
        let settings = {
            fontSize: 64,
            speed: 1.0,
            isMirrored: false,
            textAlign: 'center' 
        };

        fontSizeSlider.addEventListener('input', (e) => {
            settings.fontSize = e.target.value;
            fontVal.innerText = `${settings.fontSize}px`;
            document.getElementById('prompter-text').style.fontSize = `${settings.fontSize}px`;
            updatePreviewContent();
        });

        speedSlider.addEventListener('input', (e) => {
            settings.speed = parseFloat(e.target.value);
            speedVal.innerText = `x${settings.speed.toFixed(1)}`;
        });

        scriptInput.addEventListener('input', updatePreviewContent);

        function updatePreviewContent() {
            const rawText = scriptInput.value.replace(/\n/g, '<br>');
            document.getElementById('prompter-text').innerHTML = rawText;
            document.getElementById('mini-prompter-text').innerHTML = rawText;
        }

        // Toggle Miroir
        const mirrorToggle = document.getElementById('mirror-toggle');
        const mirrorKnob = document.getElementById('mirror-knob');
        function toggleMirrorSetting() {
            settings.isMirrored = !settings.isMirrored;
            if (settings.isMirrored) {
                mirrorToggle.classList.remove('bg-white/20');
                mirrorToggle.classList.add('bg-[var(--gold)]');
                mirrorKnob.classList.add('translate-x-6');
                mirrorKnob.classList.replace('bg-white', 'bg-black');
            } else {
                mirrorToggle.classList.add('bg-white/20');
                mirrorToggle.classList.remove('bg-[var(--gold)]');
                mirrorKnob.classList.remove('translate-x-6');
                mirrorKnob.classList.replace('bg-black', 'bg-white');
            }
            
            if (settings.isMirrored) {
                document.getElementById('mini-prompter-text').parentElement.classList.add('mirrored-text');
                if (isCameraActive) videoElement.classList.add('mirrored-text');
            } else {
                document.getElementById('mini-prompter-text').parentElement.classList.remove('mirrored-text');
                if (isCameraActive) videoElement.classList.remove('mirrored-text');
            }
        }

        // Alignement
        const alignLeftBtn = document.getElementById('align-left');
        const alignCenterBtn = document.getElementById('align-center');
        const alignRightBtn = document.getElementById('align-right');
        
        function setAlignment(align) {
            settings.textAlign = align;
            [alignLeftBtn, alignCenterBtn, alignRightBtn].forEach(btn => {
                btn.classList.remove('bg-[var(--gold)]', 'text-black');
                btn.classList.add('text-white', 'hover:bg-white/10');
            });
            const activeBtn = document.getElementById(`align-${align}`);
            activeBtn.classList.remove('text-white', 'hover:bg-white/10');
            activeBtn.classList.add('bg-[var(--gold)]', 'text-black');
            
            document.getElementById('prompter-text').style.textAlign = align;
            document.getElementById('mini-prompter-text').style.textAlign = align;
        }

        // --- STREAMING_CHUNK:Logique Caméra & Enregistrement Vidéo ---
        const videoElement = document.getElementById('camera-preview');
        const fsVideoElement = document.getElementById('fs-camera-preview');
        const toggleCameraBtn = document.getElementById('toggleCameraBtn');
        const recordBtn = document.getElementById('recordBtn');
        const fsRecordBtn = document.getElementById('fsRecordBtn');
        
        let mediaStream = null;
        let isCameraActive = false;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;

        toggleCameraBtn.addEventListener('click', toggleCamera);
        recordBtn.addEventListener('click', toggleRecording);
        fsRecordBtn.addEventListener('click', toggleRecording);

        async function toggleCamera() {
            if (isCameraActive) {
                if (mediaStream) {
                    mediaStream.getTracks().forEach(track => track.stop());
                }
                videoElement.srcObject = null;
                fsVideoElement.srcObject = null;
                videoElement.style.display = 'none';
                fsVideoElement.style.display = 'none';
                document.getElementById('fs-camera-overlay').style.display = 'none';
                
                toggleCameraBtn.innerHTML = '<i class="fa-solid fa-video-slash"></i>';
                toggleCameraBtn.classList.remove('bg-green-500/20', 'text-green-500');
                toggleCameraBtn.classList.add('bg-white/10', 'text-white');
                
                recordBtn.classList.add('hidden');
                document.querySelectorAll('.fs-record-element').forEach(el => el.classList.add('hidden'));
                
                isCameraActive = false;
                if(isRecording) stopRecording();
            } else {
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    videoElement.srcObject = mediaStream;
                    fsVideoElement.srcObject = mediaStream;
                    videoElement.style.display = 'block';
                    
                    toggleCameraBtn.innerHTML = '<i class="fa-solid fa-video"></i>';
                    toggleCameraBtn.classList.remove('bg-white/10', 'text-white');
                    toggleCameraBtn.classList.add('bg-green-500/20', 'text-green-500');
                    
                    recordBtn.classList.remove('hidden');
                    document.querySelectorAll('.fs-record-element').forEach(el => el.classList.remove('hidden'));
                    
                    if(settings.isMirrored) {
                        videoElement.classList.add('mirrored-text');
                    }

                    isCameraActive = true;
                } catch (err) {
                    console.error("Erreur caméra: ", err);
                    showToast("Impossible d'accéder à la caméra.");
                }
            }
        }

        function toggleRecording() {
            if (!isCameraActive) return;
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }

        function startRecording() {
            recordedChunks = [];
            let options = { mimeType: 'video/webm; codecs=vp9,opus' };
            if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                options = { mimeType: 'video/webm; codecs=vp8,opus' };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                     options = { mimeType: 'video/webm' };
                }
            }

            try {
                mediaRecorder = new MediaRecorder(mediaStream, options);
            } catch (e) {
                return;
            }

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) recordedChunks.push(event.data);
            };

            mediaRecorder.onstop = saveRecordingFile;
            mediaRecorder.start();
            isRecording = true;

            recordBtn.innerHTML = '<i class="fa-solid fa-square"></i>';
            recordBtn.classList.add('recording-indicator');
            fsRecordBtn.innerHTML = '<i class="fa-solid fa-square"></i>';
            fsRecordBtn.classList.add('recording-indicator');
        }

        function stopRecording() {
            if(mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            isRecording = false;
            
            recordBtn.innerHTML = '<i class="fa-solid fa-circle"></i>';
            recordBtn.classList.remove('recording-indicator');
            fsRecordBtn.innerHTML = '<i class="fa-solid fa-circle"></i>';
            fsRecordBtn.classList.remove('recording-indicator');
        }

        function saveRecordingFile() {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            document.body.appendChild(a);
            a.style.display = 'none';
            a.href = url;
            a.download = `baniki_teleprompter_${new Date().getTime()}.webm`;
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
            showToast("Vidéo enregistrée et téléchargée avec succès !");
        }

        // --- STREAMING_CHUNK:Lecteur Téléprompteur Plein Écran & Aperçu ---
        const setupScreen = document.getElementById('setup-screen');
        const prompterMode = document.getElementById('prompter-mode');
        const prompterDisplay = document.getElementById('prompter-display');
        const prompterText = document.getElementById('prompter-text');
        const paddingTop = document.getElementById('prompter-padding-top');
        const playIcon = document.getElementById('playIcon');
        const prompterControls = document.getElementById('prompter-controls');
        const speedFeedback = document.getElementById('speed-feedback');
        
        const miniDisplay = document.getElementById('mini-prompter-display');
        const miniPaddingTop = document.getElementById('mini-prompter-padding-top');
        const playPreviewIcon = document.getElementById('playPreviewIcon');
        
        let isPlayingFull = false;
        let isPlayingMini = false;
        let animationFrameIdFull = null;
        let animationFrameIdMini = null;
        
        let currentScrollYFull = 0;
        let currentScrollYMini = 0;
        let baseSpeedMultiplier = 2; 

        function initPrompter(isFullscreen = true) {
            if(!scriptInput.value.trim()) {
                scriptInput.classList.add('border-red-500');
                setTimeout(() => scriptInput.classList.remove('border-red-500'), 500);
                return;
            }

            if (isFullscreen) {
                prompterText.style.fontSize = `${settings.fontSize}px`;
                
                if(settings.isMirrored) {
                    prompterText.parentElement.classList.add('mirrored-text');
                    if(isCameraActive) fsVideoElement.classList.add('mirrored-text');
                } else {
                    prompterText.parentElement.classList.remove('mirrored-text');
                    fsVideoElement.classList.remove('mirrored-text');
                }

                paddingTop.style.height = `${window.innerHeight * 0.6}px`;

                if(isCameraActive) {
                    fsVideoElement.style.display = 'block';
                    document.getElementById('fs-camera-overlay').style.display = 'block';
                } else {
                    fsVideoElement.style.display = 'none';
                    document.getElementById('fs-camera-overlay').style.display = 'none';
                }

                setupScreen.classList.add('hidden');
                prompterMode.classList.remove('hidden');
                prompterMode.classList.add('flex');
                
                try {
                    if (prompterMode.requestFullscreen) {
                        prompterMode.requestFullscreen().catch(()=>{});
                    }
                } catch(e){}

                prompterDisplay.scrollTop = 0;
                currentScrollYFull = 0;
                isPlayingFull = false;
                updatePlayIconFull();
                prompterDisplay.focus();
                
                if(isPlayingMini) togglePlayPreview();
            }
        }

        function exitPrompter() {
            stopScrollFull();
            prompterMode.classList.add('hidden');
            prompterMode.classList.remove('flex');
            setupScreen.classList.remove('hidden');
            
            if (document.fullscreenElement) {
                document.exitFullscreen().catch(()=>{});
            }
        }

        function scrollLoopFull() {
            if (isPlayingFull) {
                currentScrollYFull += (settings.speed * baseSpeedMultiplier);
                prompterDisplay.scrollTop = currentScrollYFull;
                
                if (prompterDisplay.scrollTop + prompterDisplay.clientHeight >= prompterDisplay.scrollHeight - 2) {
                    isPlayingFull = false;
                    updatePlayIconFull();
                } else {
                    animationFrameIdFull = requestAnimationFrame(scrollLoopFull);
                }
            }
        }

        function scrollLoopMini() {
            if (isPlayingMini) {
                currentScrollYMini += (settings.speed * baseSpeedMultiplier * 0.5); 
                miniDisplay.scrollTop = currentScrollYMini;
                
                if (miniDisplay.scrollTop + miniDisplay.clientHeight >= miniDisplay.scrollHeight - 2) {
                    isPlayingMini = false;
                    updatePlayIconMini();
                } else {
                    animationFrameIdMini = requestAnimationFrame(scrollLoopMini);
                }
            }
        }

        function togglePlayPause() {
            isPlayingFull = !isPlayingFull;
            updatePlayIconFull();
            
            if (isPlayingFull) {
                currentScrollYFull = prompterDisplay.scrollTop;
                animationFrameIdFull = requestAnimationFrame(scrollLoopFull);
                hideControlsAuto();
            } else {
                stopScrollFull();
                showControls();
            }
        }

        function togglePlayPreview() {
            isPlayingMini = !isPlayingMini;
            updatePlayIconMini();
            
            if (isPlayingMini) {
                miniPaddingTop.style.height = `130px`;
                if(currentScrollYMini === 0) miniDisplay.scrollTop = 0;
                currentScrollYMini = miniDisplay.scrollTop;
                animationFrameIdMini = requestAnimationFrame(scrollLoopMini);
            } else {
                if (animationFrameIdMini) {
                    cancelAnimationFrame(animationFrameIdMini);
                    animationFrameIdMini = null;
                }
            }
        }

        function stopScrollFull() {
            if (animationFrameIdFull) {
                cancelAnimationFrame(animationFrameIdFull);
                animationFrameIdFull = null;
            }
        }

        function restartPrompter() {
            prompterDisplay.scrollTo({ top: 0, behavior: 'smooth' });
            currentScrollYFull = 0;
            if(!isPlayingFull) showControls();
        }

        function restartPreview() {
            miniDisplay.scrollTo({ top: 0, behavior: 'smooth' });
            currentScrollYMini = 0;
        }

        function adjustSpeed(delta) {
            let newSpeed = parseFloat(settings.speed) + delta;
            if(newSpeed < 0.1) newSpeed = 0.1;
            if(newSpeed > 10.0) newSpeed = 10.0;
            settings.speed = parseFloat(newSpeed.toFixed(1));
            speedSlider.value = settings.speed;
            speedVal.innerText = `x${settings.speed.toFixed(1)}`;
            showSpeedFeedback();
        }

        function updatePlayIconFull() {
            if(isPlayingFull) {
                playIcon.classList.replace('fa-play', 'fa-pause');
                playIcon.classList.remove('ml-1');
            } else {
                playIcon.classList.replace('fa-pause', 'fa-play');
                playIcon.classList.add('ml-1');
            }
        }

        function updatePlayIconMini() {
            if(isPlayingMini) {
                playPreviewIcon.classList.replace('fa-play', 'fa-pause');
                playPreviewIcon.classList.remove('ml-0.5');
            } else {
                playPreviewIcon.classList.replace('fa-pause', 'fa-play');
                playPreviewIcon.classList.add('ml-0.5');
            }
        }

        let controlsTimeout;
        function showControls() {
            prompterControls.style.opacity = '1';
            prompterControls.style.pointerEvents = 'auto';
            hideControlsAuto();
        }

        function hideControlsAuto() {
            clearTimeout(controlsTimeout);
            if(isPlayingFull) {
                controlsTimeout = setTimeout(() => {
                    prompterControls.style.opacity = '0';
                    prompterControls.style.pointerEvents = 'none';
                }, 2500);
            }
        }
        
        document.getElementById('prompter-mode').addEventListener('mousemove', showControls);

        let speedFeedbackTimeout;
        function showSpeedFeedback() {
            speedFeedback.innerText = `Vitesse : x${settings.speed.toFixed(1)}`;
            speedFeedback.style.opacity = '1';
            clearTimeout(speedFeedbackTimeout);
            speedFeedbackTimeout = setTimeout(() => {
                speedFeedback.style.opacity = '0';
            }, 1500);
        }

        prompterDisplay.addEventListener('wheel', () => {
            if(isPlayingFull) togglePlayPause();
            currentScrollYFull = prompterDisplay.scrollTop;
        }, {passive: true});
        
        prompterDisplay.addEventListener('touchmove', () => {
            if(isPlayingFull) togglePlayPause();
            currentScrollYFull = prompterDisplay.scrollTop;
        }, {passive: true});

        window.addEventListener('keydown', (e) => {
            if(!prompterMode.classList.contains('hidden')) {
                if(e.code === 'Space') {
                    e.preventDefault();
                    togglePlayPause();
                } else if(e.code === 'Escape') {
                    exitPrompter();
                } else if(e.code === 'ArrowUp') {
                    e.preventDefault();
                    adjustSpeed(0.1);
                } else if(e.code === 'ArrowDown') {
                    e.preventDefault();
                    adjustSpeed(-0.1);
                } else if(e.code === 'KeyR' && isCameraActive) {
                    e.preventDefault();
                    toggleRecording();
                }
            }
        });
        
        miniPaddingTop.style.height = `130px`;

    </script>
</body>
</html>
